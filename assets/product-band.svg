<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="SafeBand NFC-Armband">
  <title>SafeBand NFC-Armband</title>
  <defs>
    <linearGradient id="strapTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e3f6e"/>
      <stop offset="100%" stop-color="#082A4A"/>
    </linearGradient>
    <linearGradient id="strapBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082A4A"/>
      <stop offset="100%" stop-color="#061e36"/>
    </linearGradient>
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="40%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#082A4A"/>
      <path d="M0 4 H8 M4 0 V8" stroke="#0d3f6a" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082A4A" flood-opacity="0.2"/>
    </filter>
    <filter id="modSh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <!-- Left strap -->
    <path d="M30 108 Q30 96 42 96 H210 Q222 96 222 108 V132 Q222 144 210 144 H42 Q30 144 30 132 Z" fill="url(#weave)"/>
    <path d="M30 108 Q30 96 42 96 H210 Q222 96 222 108 V132 Q222 144 210 144 H42 Q30 144 30 132 Z" fill="url(#strapTop)" opacity="0.25"/>
    <path d="M30 120 V132 Q30 144 42 144 H210 Q222 144 222 132 V120 Z" fill="url(#strapBot)" opacity="0.35"/>

    <!-- Right strap -->
    <path d="M338 108 Q338 96 350 96 H518 Q530 96 530 108 V132 Q530 144 518 144 H350 Q338 144 338 132 Z" fill="url(#weave)"/>
    <path d="M338 108 Q338 96 350 96 H518 Q530 96 530 108 V132 Q530 144 518 144 H350 Q338 144 338 132 Z" fill="url(#strapTop)" opacity="0.25"/>
    <path d="M338 120 V132 Q338 144 350 144 H518 Q530 144 530 132 V120 Z" fill="url(#strapBot)" opacity="0.35"/>

    <!-- Loop ends -->
    <rect x="14" y="104" width="18" height="32" rx="5" fill="#061e36"/>
    <rect x="528" y="104" width="18" height="32" rx="5" fill="#061e36"/>

    <!-- NFC module -->
    <g filter="url(#modSh)">
      <rect x="214" y="72" width="132" height="96" rx="16" fill="url(#moduleGrad)" stroke="#444" stroke-width="1.5"/>
      <rect x="220" y="78" width="120" height="22" rx="11" fill="#FFFFFF" opacity="0.07"/>
    </g>

    <!-- Shield on module -->
    <g transform="translate(268, 90) scale(0.5)">
      <path fill="#FFFFFF" d="M34 4C34 4 8 14 8 38C8 62 34 80 34 80C34 80 60 62 60 38C60 14 34 4 34 4Z"/>
      <circle cx="27" cy="30" r="5.5" fill="#082A4A"/>
      <path fill="#082A4A" d="M21.5 37.5C27 35 32.5 37.5 34.5 52C27 49.5 19.5 52 17.5 50Z"/>
      <circle cx="41" cy="40" r="4.5" fill="#082A4A"/>
      <path fill="#082A4A" d="M37 46C41 44 45 46 46 57C41 55 36 57 34.5 55.5Z"/>
      <path fill="#6BBF9A" d="M52 68C52 63.5 56 59.5 60.5 62C65 59.5 68.5 63.5 68.5 68C68.5 74.5 60.5 81 60.5 81C60.5 81 52 74.5 52 68Z"/>
    </g>

    <text x="280" y="142" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">SafeBand</text>

    <!-- NFC icon -->
    <g transform="translate(280, 154)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
      <path d="M-16 10 Q-8 0 0 10"/>
      <path d="M-11 10 Q-4 4 3 10"/>
      <path d="M-6 10 Q0 7 6 10"/>
    </g>
  </g>

  <ellipse cx="280" cy="188" rx="160" ry="12" fill="#082A4A" opacity="0.07"/>
</svg>
